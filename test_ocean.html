<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ocean and Shark Test</title>
  <style>
    body { margin: 0; background: #021018; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="testCanvas" width="1280" height="720"></canvas>
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fish.js"></script>
  <script src="js/world.js"></script>
  <script>
    const canvas = document.getElementById('testCanvas');
    const ctx = canvas.getContext('2d');
    const world = new window.ABYSS.OceanWorld(12345);
    
    // Simulate camera near the shallows (y = 480)
    const cam = { x: 2200, y: 480, zoom: 0.85, shake: 0 };
    const time = 2.5;
    
    // Draw upgraded ocean background (shows sky, clouds, sun, seagulls, wave line, god rays, caustics, depth)
    world.drawBackground(ctx, 1280, 720, cam, cam.zoom, time, false);

    // Draw an Apex Shark swimming naturally in the shallow water
    const shark = {
      x: 640,
      y: 420,
      radius: 46,
      angle: 0.08,
      art: 'shark',
      colors: window.ABYSS.SPECIES[4].palette,
      phase: 3.2,
      swim: 0.65,
      seed: 0.42
    };
    window.ABYSS.FishArt.draw(ctx, shark, time);

    // Draw a second shark (Tiger variant) in the background
    const shark2 = {
      x: 980,
      y: 520,
      radius: 42,
      angle: -0.15,
      art: 'shark',
      colors: window.ABYSS.SPECIES[4].palette,
      phase: 1.8,
      swim: 0.5,
      seed: 0.85
    };
    window.ABYSS.FishArt.draw(ctx, shark2, time);
  </script>
</body>
</html>
