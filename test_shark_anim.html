<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shark Animation Test</title>
  <style>
    body { background: #071926; color: #fff; font-family: sans-serif; padding: 20px; }
    canvas { background: #0c283d; border: 1px solid #1a4f75; border-radius: 8px; margin: 10px; }
  </style>
</head>
<body>
  <h2>Shark Swimming Animation Frames</h2>
  <div id="frames"></div>
  <script src="js/config.js"></script>
  <script src="js/fish.js"></script>
  <script>
    const container = document.getElementById('frames');
    const phases = [0, 0.8, 1.6, 2.4, 3.2, 4.0, 4.8, 5.6];
    
    phases.forEach((p, idx) => {
      const c = document.createElement('canvas');
      c.width = 320;
      c.height = 180;
      const ctx = c.getContext('2d');
      
      const fish = {
        x: 160,
        y: 90,
        angle: 0,
        radius: 46,
        art: 'shark',
        colors: A.SPECIES[4].palette,
        phase: p,
        swim: 0.8,
        seed: 0.5,
        noShadow: false
      };
      
      A.FishArt.draw(ctx, fish, 0);
      
      ctx.fillStyle = '#7cf7c8';
      ctx.font = '14px sans-serif';
      ctx.fillText(`Frame ${idx} (phase: ${p.toFixed(1)})`, 10, 20);
      container.appendChild(c);
    });
  </script>
</body>
</html>
